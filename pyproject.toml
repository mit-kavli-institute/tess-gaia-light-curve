[project]
name = "tglc"
description = "TESS-Gaia Light Curve"
authors = [
  { name = "Te Han", email = "tehanhunter@gmail.com" },
  { name = "Jack Haviland", email = "haviland@mit.edu" },
]
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
urls = { homepage = "https://github.com/mit-kavli-institute/tess-gaia-light-curve", source = "https://github.com/mit-kavli-institute/tess-gaia-light-curve.git" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11, <3.13"
dependencies = [
  "astropy",
  "h5py",
  "matplotlib",
  "numba",
  "numpy",
  "pandas",
  "requests",
  "scipy",
  "tesswcs>=1.7.3",  # first release with Cycle 9 (sector 108+) pointings
  "tqdm",
]
scripts = { tglc = "tglc.__main__:tglc_main" }

[project.optional-dependencies]
pyticdb = ["pyticdb"]
cupy = ["cupy"]
# Keep in sync with the mypy hook's `rev` and `additional_dependencies` in .pre-commit-config.yaml.
typing = ["mypy==2.4.0", "pandas-stubs", "sqlalchemy", "types-requests", "types-tqdm"]
dev = [
  "hypothesis",
  "nox",
  "pooch",
  "pre-commit",
  "psycopg[binary]",  # e2e database fixtures; the binary wheel bundles libpq
  "pytest",
  "pytest-docker",
  "ruff==0.17.2",
  "tglc[pyticdb,typing]",
]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["tglc", "tglc.*"]

# Declared explicitly rather than relying on `include-package-data` alone. That setting discovers
# package data through setuptools-scm's git file finder, which finds nothing when the build runs
# from a source tree with no git metadata -- an extracted release tarball, a vendored copy, or a
# checkout exported with `git archive`. The mask was then dropped from the wheel silently, and
# `tglc cutouts` failed at run time looking for it (FileNotFoundError on median_mask.fits).
[tool.setuptools.package-data]
"tglc.utils.data" = ["*.fits"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-m", "not network"]
markers = [
  "network: tests that contact the real JPL Horizons API; deselected by default, run with `pytest -m network`",
]
xfail_strict = true
filterwarnings = ["error"]
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
  "B",   # flake8-bugbear
  "I",   # isort
  "UP",  # pyupgrade
  "NPY", # numpy-specific
  "PD",  # pandas-specific
  "S101", # assert: stripped under `python -O`, so never use it for run-time checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Optional or untyped third-party packages.
module = ["astropy.*", "cupy.*", "cupy_backends.*", "h5py.*", "numba.*", "pyticdb.*", "scipy.*", "tesswcs.*"]
ignore_missing_imports = true

[tool.codespell]
skip = "*.fits,*.ipynb,tests/sample_data/*"
ignore-words-list = "te"  # Te Han

[tool.repo-review]
# Checks from https://learn.scientific-python.org/development/guides/repo-review/ we skip on purpose.
ignore = [
  "PP304",  # pytest `log_level` would change caplog levels the logging tests rely on
  "PY004",  # no docs folder yet; Sphinx + Read the Docs is a follow-up to issue #5
  "PP004",  # requires-python upper cap is kept until numba/cupy support is verified on 3.13
  "PP006",  # dev tools stay in the `dev` extra: `pip install .[dev]` is the documented workflow
  "MY101",  # mypy strict mode is a per-module ratchet after the initial non-strict baseline
  "PC170",  # PyGrep hooks only matter for reStructuredText, and the repo has none
  "PC180",  # no markdown formatter; README/tutorials are hand-formatted
  "PC901",  # PC90x configure pre-commit.ci, which we do not use (CI runs pre-commit itself)
  "PC902",
  "PC903",
]

[tool.uv]
index = [
  { name = "MIT-Kavli", url = "https://mit-kavli-institute.github.io/MIT-Kavli-PyPi/" },
]
